name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hcp_user
          POSTGRES_PASSWORD: hcp_pass
          POSTGRES_DB: hcp_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcp_user -d hcp_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://hcp_user:hcp_pass@localhost:5432/hcp_crm_test
      # Never a real key: tests block all Groq calls and fake the LLM.
      GROQ_API_KEY: ci-dummy-key
      # Test-only signing secret (tests also set their own).
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Mypy
        run: mypy

      - name: Migrations from empty DB match models (drift check)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: python -m app.db_migrations check-fresh

      - name: Pytest
        run: pytest -rxX -v

  frontend:
    name: Frontend (build, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Vitest
        run: npm test

  e2e:
    name: End-to-end (Playwright, fake Groq)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hcp_user
          POSTGRES_PASSWORD: hcp_pass
          POSTGRES_DB: hcp_crm_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcp_user -d hcp_crm_e2e_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway CI database and test-only values; Groq is the local fake server.
      E2E_DATABASE_URL: postgresql+asyncpg://hcp_user:hcp_pass@127.0.0.1:5432/hcp_crm_e2e_test
      E2E_PYTHON: python
      E2E_PASSWORD: ci-e2e-only-password

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r ../backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
