name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hcp_user
          POSTGRES_PASSWORD: hcp_pass
          POSTGRES_DB: hcp_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hcp_user -d hcp_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://hcp_user:hcp_pass@localhost:5432/hcp_crm_test
      # Never a real key: tests block all Groq calls and fake the LLM.
      GROQ_API_KEY: ci-dummy-key

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -rxX -v

  frontend:
    name: Frontend (build, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Vitest
        run: npm test
