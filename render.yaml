# Render Blueprint: https://render.com/docs/blueprint-spec
# Creates the API (Docker, free plan) and the frontend (static site).
# Postgres is NOT created here: use Neon (see docs/DEPLOY.md) and paste its URL
# into DATABASE_URL. Values marked `sync: false` are asked for when you create
# the Blueprint and are never stored in this file.

services:
  - type: web
    name: hcp-crm-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL          # Neon connection string (direct, not -pooler), ends with ?sslmode=require
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET            # random 256-bit value generated by Render
        generateValue: true
      - key: FRONTEND_ORIGIN       # https://<your static site>.onrender.com (no trailing slash)
        sync: false
      - key: CORS_ORIGINS          # optional extra origins, comma-separated (e.g. a custom domain)
        value: ""
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      - key: DEMO_REP_PASSWORD     # only needed if you run the demo seed from Render; the
        sync: false                # nightly GitHub job uses its own secrets
      - key: DEMO_MANAGER_PASSWORD
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_MODEL_FAST
        value: openai/gpt-oss-20b
      - key: GROQ_TRANSCRIBE_MODEL
        value: whisper-large-v3-turbo
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: RATE_LIMIT_LLM_PER_MINUTE  # per signed-in user; caps Groq spend from a public demo
        value: "10"

  - type: web
    name: hcp-crm-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: VITE_API_URL          # https://<your api service>.onrender.com (baked in at build time)
        sync: false
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
